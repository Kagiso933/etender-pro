name: Update tender data

on:
  schedule:
    - cron: "17 4,10,16,22 * * *"   # every 6 hours (06:17, 12:17, 18:17, 00:17 SAST)
  workflow_dispatch:                # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - etender_scraper.py
      - .github/workflows/update-tenders.yml

permissions:
  contents: write

concurrency:
  group: update-tenders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the eTenders API is reachable
        run: |
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" --max-time 60 \
            "https://ocds-api.etenders.gov.za/api/OCDSReleases?PageNumber=1&PageSize=1&dateFrom=$(date -u -d '-3 days' +%F)&dateTo=$(date -u +%F)") || code="curl-failed($?)"
          echo "API probe: $code"
          if [ "$code" != "200" ]; then echo "::error::eTenders API probe returned $code: $(head -c 300 /tmp/probe.json 2>/dev/null)"; exit 1; fi

      - name: Fetch open IT tenders from the eTenders API
        run: python3 etender_scraper.py --days 60 --out data/tenders.json

      - name: Commit updated data
        run: |
          git config user.name "etender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update tender data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
