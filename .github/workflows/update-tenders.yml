name: Update tender data

on:
  schedule:
    - cron: "17 4,10,16,22 * * *"   # every 6 hours (06:17, 12:17, 18:17, 00:17 SAST)
  workflow_dispatch:                # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - etender_scraper.py
      - .github/workflows/update-tenders.yml

permissions:
  contents: write

concurrency:
  group: update-tenders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch open IT tenders from the eTenders API
        run: python3 etender_scraper.py --days 60 --out data/tenders.json

      - name: Commit updated data
        run: |
          git config user.name "etender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update tender data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
