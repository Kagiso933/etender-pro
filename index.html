<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA eTender Pro | Ryno-Tec</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Csvg x='7' y='7' width='50' height='50' viewBox='50 -10 320 320'%3E%3Cpath d='M80 300 V80 H200 L240 120 V190 L200 230 H80' fill='none' stroke='%23ffffff' stroke-width='46'/%3E%3Cpath d='M155 230 L340 280' fill='none' stroke='%23ffffff' stroke-width='46'/%3E%3Cpath d='M254.1 226.4 L341.1 249.2' fill='none' stroke='%23ff6b35' stroke-width='40'/%3E%3Cpolygon points='313.6,245.9 351.2,136.4 347.6,134.6 281.6,229.7' fill='%23ff6b35'/%3E%3C/svg%3E%3C/svg%3E">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
  /* Ryno-Tec brand: charcoal header, light working area, orange accent (matches ryno-tec.co.za and the Business Hub) */
  :root {
    --head: #1a1a1a; --head-2: #2d2d2d; --head-ink: #e2e8f0; --head-muted: #9aa0a6;
    --bg: #f5f5f5; --surface: #ffffff; --sunk: #ececec; --line: #e0e0e0;
    --ink: #1a1a1a; --text: #333333; --muted: #666666;
    --accent: #ff6b35; --accent-hover: #e55a1f; --accent-ink: #c4471a; --accent-soft: #fff0ea; --on-accent: #1a1a1a;
    --warn: #a86400; --bad: #c0392b; --good: #2e7d4f; --good-soft: #e6f4ec;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --head: #141414; --head-2: #262626;
      --bg: #1a1a1a; --surface: #2d2d2d; --sunk: #242424; --line: #404040;
      --ink: #ffffff; --text: #e6e6e6; --muted: #b0b0b0;
      --accent-ink: #ff8a5c; --accent-soft: #3a2a22;
      --warn: #f0b44c; --bad: #ff6b6b; --good: #5fbf8a; --good-soft: #1f3a2b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --head: #141414; --head-2: #262626;
    --bg: #1a1a1a; --surface: #2d2d2d; --sunk: #242424; --line: #404040;
    --ink: #ffffff; --text: #e6e6e6; --muted: #b0b0b0;
    --accent-ink: #ff8a5c; --accent-soft: #3a2a22;
    --warn: #f0b44c; --bad: #ff6b6b; --good: #5fbf8a; --good-soft: #1f3a2b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); line-height: 1.6; color: var(--text); background: var(--bg); min-height: 100vh; font-variant-numeric: tabular-nums; }
  a { color: var(--accent-ink); }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); background: var(--surface);
         border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; width: 100%; outline: none; transition: border-color .2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,107,53,.15); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 22px 16px 60px; }

  /* header — same as the website's nav bar */
  .top { position: sticky; top: 0; z-index: 10; background: var(--head); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .top .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .brand-mark { width: 40px; height: 40px; flex: none; color: #fff; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; }
  .brand h1 span { font-weight: 400; color: #cbd5e1; }
  .brand p { margin: 2px 0 0; color: var(--head-muted); font-size: 13px; }
  .top .btn { background: transparent; color: #fff; border-color: #555; }
  .top .btn:hover { border-color: var(--accent); color: var(--accent); }
  .top .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .top .btn.primary:hover { background: var(--accent-hover); color: var(--on-accent); }
  .top a.site { color: var(--head-ink); font-size: 14px; text-decoration: none; padding: 9px 6px; }
  .top a.site:hover { color: var(--accent); }

  .btn { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 4px; padding: 9px 16px; font-weight: 600; font-size: 14px; transition: border-color .2s, background .2s; text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 20px; flex-wrap: wrap; }
  .tabs button { padding: 11px 16px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px; margin-bottom: -1px; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  label.l { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .meta { color: var(--muted); font-size: 13px; margin: 14px 2px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

  /* tender cards — like the site's expertise cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 20px 22px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-left-color: var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,.08); }
  .card.sel { border-color: var(--accent); border-left-color: var(--accent); }
  .card h3 { margin: 8px 0 6px; font-size: 17px; line-height: 1.4; color: var(--ink); font-weight: 600; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); margin-right: 6px; }
  .chip.gray { background: var(--sunk); color: var(--muted); }
  .chip.saved { background: var(--good-soft); color: var(--good); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 14px 0; }
  .fact { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
  .fact .k { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .fact .v { font-weight: 700; margin-top: 3px; color: var(--ink); }
  .fact .v.ok { color: var(--good); }
  .urgent { color: var(--bad); } .soon { color: var(--warn); } .ok { color: var(--good); }
  .fact .v.urgent { color: var(--bad); } .fact .v.soon { color: var(--warn); }
  .card, .panel, .req { min-width: 0; overflow-wrap: anywhere; }
  .docs a { max-width: 100%; overflow-wrap: anywhere; display: inline-block; margin: 4px 8px 4px 0; font-size: 13px; padding: 5px 10px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
  .docs a:hover { border-color: var(--accent); color: var(--accent-ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .req { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; background: var(--surface); }
  .req.done { opacity: .65; border-left: 4px solid var(--good); }
  .req input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .req .where { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .bar { height: 8px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .ai { white-space: pre-wrap; line-height: 1.65; font-size: 15px; }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .modal { position: fixed; inset: 0; background: rgba(10,10,10,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal .box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 760px; width: 100%; max-height: 85vh; overflow: auto; padding: 22px; box-shadow: 0 15px 40px rgba(0,0,0,.25); }
  h2 { font-size: 19px; margin: 0 0 6px; color: var(--ink); font-weight: 700; letter-spacing: -.2px; }
  .sec { margin-top: 22px; }
  @media (max-width: 600px) {
    .tabs button { padding: 10px 10px; font-size: 14px; }
    .brand-mark { width: 32px; height: 32px; }
    .brand h1 { font-size: 17px; }
    .top .row { width: 100%; }
    .meta { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Data is refreshed every 6 hours by a GitHub Action (see .github/workflows/update-tenders.yml).
// raw.githubusercontent.com is tried first so new data shows up without waiting for a Pages rebuild.
const DATA_URLS = [
  'https://raw.githubusercontent.com/Kagiso933/etender-pro/main/data/tenders.json',
  './data/tenders.json',
];
const MODEL = 'claude-sonnet-5-5';

// ---------- storage helpers (wrapped: storage can be blocked) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- Standard SA public-sector bid requirements and where to get them ----------
const STANDARD_REQS = [
  { id: 'csd', name: 'Central Supplier Database (CSD) registration',
    where: 'Register free at secure.csd.gov.za. Bidders must be registered and tax-compliant on CSD before award. Attach the CSD summary report (shows your MAAA number).',
    link: 'https://secure.csd.gov.za' },
  { id: 'tax', name: 'Tax compliance status (SARS PIN)',
    where: 'SARS eFiling > Tax Compliance Status > request a TCS PIN. Free. Include the PIN on SBD 1; the buyer verifies it on CSD/SARS.',
    link: 'https://www.sarsefiling.co.za' },
  { id: 'cipc', name: 'Company registration documents (CIPC)',
    where: 'Download your registration certificate (CoR 14.3) and director details from CIPC / BizPortal. Make sure annual returns are up to date.',
    link: 'https://www.bizportal.gov.za' },
  { id: 'bbbee', name: 'B-BBEE certificate or sworn affidavit',
    where: 'EMEs (turnover up to R10m) and 51%+ black-owned QSEs can submit a sworn affidavit (dtic template, signed before a commissioner of oaths) or the CIPC B-BBEE certificate. Larger entities need a certificate from a SANAS-accredited verification agency. Without it you usually score 0 preference points.',
    link: 'https://www.sanas.co.za' },
  { id: 'sbd', name: 'SBD forms completed and signed (SBD 1, SBD 4, SBD 6.1 etc.)',
    where: 'These come in the tender pack itself (download the documents above). Complete every page, sign where required, and do not alter the forms. Municipal tenders use MBD forms instead.' },
  { id: 'brief', name: 'Briefing session / site visit (check if compulsory)',
    where: 'Look for "compulsory briefing" in the invitation document. Missing a compulsory briefing disqualifies the bid. Keep the attendance certificate.' },
  { id: 'price', name: 'Pricing schedule completed (incl. VAT, valid for the stated period)',
    where: 'Use the pricing schedule in the tender pack. Get written quotes from distributors/OEM partners first so your costs are backed up.' },
  { id: 'exp', name: 'Proof of experience: reference letters / completed projects',
    where: 'Ask past clients for signed reference letters on their letterhead (project, value, dates, contact). Government references usually score higher.' },
  { id: 'certs', name: 'Key personnel CVs and certifications',
    where: 'CVs with ID-matching names plus certified copies of certifications (e.g. Microsoft, Cisco, AWS, ITIL, CompTIA, ISC2). Check which are mandatory in the functionality criteria.' },
  { id: 'oem', name: 'OEM / reseller authorisation letters (for hardware & licences)',
    where: 'Request from the OEM partner portal or your SA distributor - e.g. Axiz, Tarsus Distribution, Pinnacle, Mustek, Rectron, Westcon-Comstor, First Distribution. Allow 3-5 working days.' },
  { id: 'fin', name: 'Financial statements / bank rating letter (if requested)',
    where: 'Audited or independently reviewed statements from your accountant; bank rating letter from your bank (can take a week).' },
  { id: 'coida', name: 'COIDA letter of good standing (services with staff on site)',
    where: 'Department of Employment and Labour - Compensation Fund online services. Often required for on-site services and installations.' },
];

// ---------- formatting ----------
const daysLeft = (iso) => Math.ceil((new Date(iso) - new Date()) / 86400000);
const fmtDate = (iso) => new Date(iso).toLocaleString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtMoney = (v) => v ? 'R ' + Math.round(v).toLocaleString('en-ZA') : 'Not disclosed';
const urgency = (d) => d <= 3 ? 'urgent' : d <= 7 ? 'soon' : 'ok';
const ago = (iso) => { const h = Math.round((Date.now() - new Date(iso)) / 3600000); return h < 1 ? 'just now' : h < 48 ? `${h}h ago` : `${Math.round(h / 24)} days ago`; };

// ---------- Claude API (key stays in this browser only) ----------
function getKey(force) {
  let key = store.get('anthropic_api_key', '');
  if (!key || force) {
    const entered = window.prompt('Enter your Anthropic API key (get one at console.anthropic.com).\nIt is saved only in this browser.', key || '');
    if (entered === null) return key;
    key = entered.trim();
    store.set('anthropic_api_key', key);
    if (force) askWorkspace(true);
  }
  return key;
}

// Keys that are not scoped to a workspace must send the workspace ID with every request
function askWorkspace(optional) {
  const current = store.get('anthropic_workspace_id', '');
  const entered = window.prompt(
    (optional ? 'Optional: ' : 'Your API key is not scoped to a workspace, so a workspace ID is needed.\n') +
    'Workspace ID (Claude Console > Settings > Workspaces, starts with "wrkspc_").\nLeave blank if your key belongs to a workspace.',
    current);
  if (entered === null) return current;
  store.set('anthropic_workspace_id', entered.trim());
  return entered.trim();
}

async function askClaude(prompt, maxTokens = 3000, retried = false, files = []) {
  const key = getKey(false);
  if (!key) throw new Error('No API key set. Use "API key" at the top right.');
  const workspace = store.get('anthropic_workspace_id', '');
  const headers = { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true' };
  if (workspace) headers['anthropic-workspace-id'] = workspace;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers,
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content: files.length ? [...files.map(fileBlock), { type: 'text', text: prompt }] : prompt }] }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data?.error?.message || `API error ${res.status}`;
    if (!retried && /workspace/i.test(msg) && askWorkspace(false)) return askClaude(prompt, maxTokens, true, files);
    if (files.length && /page|too large|exceed|size|pdf/i.test(msg)) throw new Error(msg + ' Large tender packs can exceed the limit: remove an attachment, upload only the sections you need (scope, specifications, evaluation), or paste the text instead.');
    throw new Error(msg);
  }
  return (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
}

// ---------- tender documents: uploaded files kept per tender in IndexedDB ----------
const DOC_TYPES = { 'application/pdf': 'pdf', 'image/png': 'image', 'image/jpeg': 'image', 'image/webp': 'image', 'image/gif': 'image' };
const MAX_DOC_BYTES = 24 * 1024 * 1024;
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('etender-pro-docs', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('docs', mode); const q = fn(t.objectStore('docs')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', s => s.get(k)).catch(() => undefined), set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}) };
})();
const MEM_DOCS = {};
async function loadDocs(id) { if (MEM_DOCS[id]) return MEM_DOCS[id]; const v = await idb.get('files_' + id); return (MEM_DOCS[id] = Array.isArray(v) ? v : []); }
async function saveDocs(id, files) { MEM_DOCS[id] = files; await idb.set('files_' + id, files); }
const fileBlock = f => f.kind === 'pdf'
  ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: f.data }, title: f.name }
  : { type: 'image', source: { type: 'base64', media_type: f.type, data: f.data } };
const toB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

// Reads uploads: PDFs and images go to Claude as-is (it reads scanned pages too); Word and text files become text.
async function readUploads(fileList) {
  const files = [], texts = [], skipped = [];
  for (const file of fileList) {
    const name = file.name, lower = name.toLowerCase();
    try {
      if (DOC_TYPES[file.type] || lower.endsWith('.pdf')) {
        const type = DOC_TYPES[file.type] ? file.type : 'application/pdf';
        files.push({ name, type, kind: DOC_TYPES[type], size: file.size, data: toB64(await file.arrayBuffer()) });
      } else if (lower.endsWith('.docx')) {
        if (!window.mammoth) throw new Error('Word reader did not load');
        const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        texts.push(`--- ${name} ---\n${r.value.trim()}`);
      } else if (lower.endsWith('.doc')) {
        skipped.push(`${name} (old .doc format: save it as PDF or .docx first)`);
      } else if (/\.(txt|csv|md|html?)$/.test(lower) || file.type.startsWith('text/')) {
        texts.push(`--- ${name} ---\n${(await file.text()).trim()}`);
      } else skipped.push(`${name} (unsupported type)`);
    } catch (e) { skipped.push(`${name} (${e.message || 'could not be read'})`); }
  }
  return { files, texts, skipped };
}

function DocInput({ t, docText, setDocText, files, setFiles }) {
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const total = files.reduce((a, f) => a + f.size, 0);
  const onPick = async (e) => {
    const list = [...(e.target.files || [])]; e.target.value = '';
    if (!list.length) return;
    setBusy(true); setMsg('');
    const { files: add, texts, skipped } = await readUploads(list);
    const next = [...files, ...add.filter(a => !files.some(f => f.name === a.name && f.size === a.size))];
    const size = next.reduce((a, f) => a + f.size, 0);
    if (size > MAX_DOC_BYTES) { setMsg(`That would be ${fmtSize(size)}; the limit is ${fmtSize(MAX_DOC_BYTES)}. Upload fewer or smaller files.`); setBusy(false); return; }
    setFiles(next); await saveDocs(t.id, next);
    if (texts.length) setDocText((docText ? docText + '\n\n' : '') + texts.join('\n\n'));
    const parts = [];
    if (add.length) parts.push(`${add.length} file${add.length > 1 ? 's' : ''} attached`);
    if (texts.length) parts.push(`text from ${texts.length} Word/text file${texts.length > 1 ? 's' : ''} added below`);
    if (skipped.length) parts.push('skipped: ' + skipped.join('; '));
    setMsg(parts.join('. ') + '.');
    setBusy(false);
  };
  const remove = async (i) => { const next = files.filter((_, j) => j !== i); setFiles(next); await saveDocs(t.id, next); };
  return <>
    <label className="l">Tender documents</label>
    <div className="row" style={{ marginTop: 0, alignItems: 'center' }}>
      <label className="btn primary" style={{ cursor: busy ? 'wait' : 'pointer' }}>
        {busy ? 'Reading files…' : 'Upload PDF, Word or scans'}
        <input type="file" multiple hidden accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg,.webp,application/pdf" onChange={onPick} disabled={busy} />
      </label>
      <span className="note">Download the bid documents from the links above, then upload them here. Claude reads PDFs directly, including scanned pages.</span>
    </div>
    {files.length > 0 && <div className="docs" style={{ marginTop: 10 }}>
      {files.map((f, i) => <span key={i} className="chip gray" style={{ display: 'inline-flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
        {f.kind === 'pdf' ? '📄' : '🖼'} {f.name} · {fmtSize(f.size)}
        <button className="btn small" style={{ padding: '0 6px', border: 0, background: 'transparent' }} aria-label={'Remove ' + f.name} onClick={() => remove(i)}>×</button></span>)}
      <div className="note">{fmtSize(total)} attached. Saved in this browser for this tender. Each analysis sends the files to Claude, which uses more of your API credit than pasted text.</div>
    </div>}
    {msg && <p className="note" style={{ marginTop: 8 }}>{msg}</p>}
    <label className="l" style={{ marginTop: 14 }}>Or paste text from the documents</label>
    <textarea rows="5" value={docText} onChange={e => setDocText(e.target.value)}
      placeholder="Optional if you uploaded files. Paste the scope, specifications and evaluation criteria." />
  </>;
}
function useDocFiles(id) {
  const [files, setFiles] = useState(MEM_DOCS[id] || []);
  useEffect(() => { let live = true; loadDocs(id).then(f => { if (live) setFiles(f); }); return () => { live = false; }; }, [id]);
  return [files, setFiles];
}
const docsNote = (docText, files) => files.length || docText
  ? `${files.length ? `\nThe attached ${files.length > 1 ? files.length + ' files are' : 'file is'} the tender documents (${files.map(f => f.name).join(', ')}). Read them in full.` : ''}${docText ? `\nTEXT FROM THE TENDER DOCUMENTS:\n${docText.slice(0, 60000)}` : ''}`
  : '';

const tenderBrief = (t) => `Reference: ${t.reference}
Description: ${t.title}
Buyer: ${t.department}
Category (auto): ${t.category}
Procurement method: ${t.procurementMethod}
Estimated value: ${fmtMoney(t.value)}
Closing: ${fmtDate(t.closingDate)} (${daysLeft(t.closingDate)} days left)
Documents: ${t.documents.map(d => d.title).join('; ') || 'none listed'}`;

// ---------- App ----------
function App() {
  const [data, setData] = useState(null);
  const [loadErr, setLoadErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState('discover');
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const [within, setWithin] = useState(60);
  const [selId, setSelId] = useState(store.get('selected_tender', null));
  const [saved, setSaved] = useState(store.get('saved_tenders', []));
  const [onlySaved, setOnlySaved] = useState(false);
  const [brief, setBrief] = useState(store.get('briefing_filter', 'any'));
  useEffect(() => { store.set('briefing_filter', brief); }, [brief]);

  const load = async () => {
    setLoading(true); setLoadErr('');
    for (const url of DATA_URLS) {
      try {
        const r = await fetch(url + (url.startsWith('http') ? `?t=${Date.now()}` : ''), { cache: 'no-store' });
        if (!r.ok) continue;
        const j = await r.json();
        if (Array.isArray(j.tenders)) { setData(j); setLoading(false); openFromHash(j.tenders); return; }
      } catch (e) {}
    }
    setLoadErr('Could not load tender data yet. If you just set this up, the first GitHub Action run may still be in progress.');
    setLoading(false);
  };
  useEffect(() => { load(); }, []);
  // Deep link from the Ryno-Tec hub: #tender=<ocid>&tab=bid|analysis
  const openFromHash = (list) => {
    const h = new URLSearchParams(location.hash.slice(1));
    const id = h.get('tender');
    if (id && list.some(t => t.id === id)) { setSelId(id); setTab(['bid', 'analysis'].includes(h.get('tab')) ? h.get('tab') : 'bid'); }
  };
  useEffect(() => { const f = () => data && openFromHash(data.tenders); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, [data]);
  useEffect(() => { store.set('selected_tender', selId); }, [selId]);
  useEffect(() => { store.set('saved_tenders', saved); }, [saved]);

  const tenders = (data?.tenders || []).filter(t => daysLeft(t.closingDate) >= 0);
  const cats = useMemo(() => [...new Set(tenders.map(t => t.category))].sort(), [data]);
  const filtered = tenders.filter(t => {
    const s = q.toLowerCase();
    if (s && !`${t.title} ${t.reference} ${t.department}`.toLowerCase().includes(s)) return false;
    if (cat !== 'all' && t.category !== cat) return false;
    if (daysLeft(t.closingDate) > within) return false;
    if (onlySaved && !saved.includes(t.id)) return false;
    const b = t.briefing || {};
    if (brief === 'online' && !b.online) return false;
    if (brief === 'compulsory' && !b.compulsory) return false;
    if (brief === 'none' && b.mode !== 'none') return false;
    return true;
  });
  const sel = tenders.find(t => t.id === selId) || null;
  const toggleSave = (id) => setSaved(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  return (
    <div>
      <div className="top"><div className="wrap">
        <div className="brand">
          <svg className="brand-mark" viewBox="50 -10 320 320" aria-hidden="true"><path d="M80 300 V80 H200 L240 120 V190 L200 230 H80" fill="none" stroke="currentColor" strokeWidth="40" strokeLinejoin="miter"/><path d="M155 230 L340 280" fill="none" stroke="currentColor" strokeWidth="40"/><path d="M146 12 H96 V60 H146" fill="none" stroke="currentColor" strokeWidth="28" strokeLinejoin="miter"/><path d="M254.1 226.4 L341.1 249.2" fill="none" stroke="#ff6b35" strokeWidth="34"/><polygon points="313.6,245.9 351.2,136.4 347.6,134.6 281.6,229.7" fill="#ff6b35"/></svg>
          <div>
          <h1>SA eTender Pro <span>by Ryno-Tec</span></h1>
          <p>{data ? `${tenders.length} open IT tenders · updated ${ago(data.generatedAt)}${data.coveredFrom ? ` · published since ${new Date(data.coveredFrom).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })}` : ''} · official eTenders API` : 'Open IT tenders from etenders.gov.za'}</p>
          </div>
        </div>
        <div className="row" style={{ marginTop: 0, alignItems: 'center' }}>
          <a className="site" href="https://www.ryno-tec.co.za" target="_blank" rel="noopener">ryno-tec.co.za ↗</a>
          <button className="btn" onClick={() => getKey(true)}>API key</button>
          <button className="btn primary" onClick={load} disabled={loading}>{loading ? 'Loading…' : 'Reload data'}</button>
        </div>
      </div></div>

      <div className="wrap">
        <div className="tabs">
          {[['discover', 'Discover tenders'], ['analysis', 'AI analysis'], ['bid', 'Bid builder']].map(([id, label]) =>
            <button key={id} className={tab === id ? 'on' : ''} onClick={() => setTab(id)}>{label}</button>)}
        </div>

        {tab === 'discover' && <>
          <div className="panel">
            <div className="grid4 grid5">
              <div style={{ gridColumn: '1 / -1' }}>
                <input placeholder="Search description, reference number or department…" value={q} onChange={e => setQ(e.target.value)} />
              </div>
              <div><label className="l">Category</label>
                <select value={cat} onChange={e => setCat(e.target.value)}>
                  <option value="all">All IT categories</option>
                  {cats.map(c => <option key={c}>{c}</option>)}
                </select></div>
              <div><label className="l">Closing within (days)</label>
                <input type="number" min="1" value={within} onChange={e => setWithin(Number(e.target.value) || 365)} /></div>
              <div><label className="l">Briefing</label>
                <select value={brief} onChange={e => setBrief(e.target.value)}>
                  <option value="any">Any briefing</option>
                  <option value="online">Online briefing ({tenders.filter(t => t.briefing?.online).length})</option>
                  <option value="compulsory">Compulsory briefing</option>
                  <option value="none">No briefing</option>
                </select></div>
              <div><label className="l">Show</label>
                <select value={onlySaved ? 'saved' : 'all'} onChange={e => setOnlySaved(e.target.value === 'saved')}>
                  <option value="all">All tenders</option><option value="saved">Saved only ({saved.length})</option>
                </select></div>
            </div>
          </div>

          <div className="meta">
            <span>Showing {filtered.length} of {tenders.length}, soonest closing first</span>
            <span className="row" style={{ marginTop: 0 }}>
              <button className="btn" disabled={!filtered.length} onClick={() => exportForHub(filtered)}>Export for Ryno-Tec hub</button>
              <a href="https://www.etenders.gov.za" target="_blank" rel="noopener">Open etenders.gov.za ↗</a>
            </span>
          </div>

          {loadErr && <div className="panel empty">{loadErr}</div>}
          {!loadErr && data && filtered.length === 0 && <div className="panel empty">No tenders match these filters.</div>}

          {filtered.map(t => {
            const d = daysLeft(t.closingDate);
            const isSel = t.id === selId;
            return (
              <div key={t.id} className={'card' + (isSel ? ' sel' : '')}>
                <div><span className="chip">{t.category}</span><span className="chip gray">{t.reference}</span>
                  {saved.includes(t.id) && <span className="chip saved">Saved</span>}</div>
                <h3>{t.title}</h3>
                <div className="note">{t.department}{t.procurementMethod ? ` · ${t.procurementMethod}` : ''}</div>
                <div className="facts">
                  <div className="fact"><div className="k">Closes</div><div className={'v ' + urgency(d)}>{fmtDate(t.closingDate)}</div>
                    <div className={'note ' + urgency(d)}>{d === 0 ? 'Closes today' : `${d} day${d === 1 ? '' : 's'} left`}</div></div>
                  <div className="fact"><div className="k">Estimated value</div><div className="v">{fmtMoney(t.value)}</div></div>
                  <div className="fact"><div className="k">Documents</div><div className="v">{t.documents.length}</div></div>
                  <Briefing b={t.briefing} />
                </div>
                {t.documents.length > 0 && <div className="docs">
                  {t.documents.map((doc, i) => <a key={i} href={doc.url} target="_blank" rel="noopener">📄 {doc.title}</a>)}
                </div>}
                {t.contact && Object.keys(t.contact).length > 0 &&
                  <div className="note" style={{ marginTop: 8 }}>Contact: {[t.contact.name, t.contact.email, t.contact.telephone].filter(Boolean).join(' · ')}</div>}
                <div className="row">
                  <button className="btn primary" onClick={() => { setSelId(t.id); setTab('bid'); }}>Build bid</button>
                  <button className="btn" onClick={() => { setSelId(t.id); setTab('analysis'); }}>AI analysis</button>
                  <button className="btn" onClick={() => toggleSave(t.id)}>{saved.includes(t.id) ? 'Unsave' : 'Save'}</button>
                </div>
              </div>
            );
          })}
        </>}

        {tab === 'analysis' && (sel ? <Analysis t={sel} /> : <Pick />)}
        {tab === 'bid' && (sel ? <BidBuilder t={sel} /> : <Pick />)}
      </div>
    </div>
  );
}

const BRIEF_LABEL = { online: 'Online', 'online and in person': 'Online and in person', 'in person': 'In person', none: 'No briefing', unknown: 'Not stated' };
function Briefing({ b }) {
  if (!b) return null;
  const when = b.date ? new Date(b.date).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  return (
    <div className="fact"><div className="k">Briefing</div>
      <div className={'v' + (b.online ? ' ok' : '')}>{BRIEF_LABEL[b.mode] || 'Not stated'}</div>
      {(when || b.compulsory != null) && <div className="note">{[when, b.compulsory === true ? 'compulsory' : b.compulsory === false ? 'optional' : ''].filter(Boolean).join(', ')}</div>}
      {b.link && <div className="note"><a href={b.link} target="_blank" rel="noopener">Join link ↗</a></div>}
    </div>
  );
}

// Same tender shape the Ryno-Tec business hub imports (Tenders → Import from tender system)
function exportForHub(list) {
  const payload = { source: 'SA eTender Pro', exportedAt: new Date().toISOString(), tenders: list };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = `etender-pro-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const Pick = () => <div className="panel empty">Pick a tender on the Discover tab first.</div>;

function TenderHeader({ t }) {
  const d = daysLeft(t.closingDate);
  return (
    <div className="panel" style={{ marginBottom: 14 }}>
      <span className="chip">{t.category}</span><span className="chip gray">{t.reference}</span>
      <h2 style={{ marginTop: 8 }}>{t.title}</h2>
      <div className="note">{t.department} · closes {fmtDate(t.closingDate)} (<span className={urgency(d)}>{d} days left</span>) · {fmtMoney(t.value)}</div>
      {t.documents.length > 0 && <div className="docs" style={{ marginTop: 8 }}>
        {t.documents.map((doc, i) => <a key={i} href={doc.url} target="_blank" rel="noopener">📄 {doc.title}</a>)}</div>}
    </div>
  );
}

// ---------- AI analysis ----------
function Analysis({ t }) {
  const key = 'analysis_' + t.id;
  const [docText, setDocText] = useState(store.get('doctext_' + t.id, ''));
  const [files, setFiles] = useDocFiles(t.id);
  const [out, setOut] = useState(store.get(key, ''));
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  useEffect(() => { store.set('doctext_' + t.id, docText); }, [docText]);

  const run = async () => {
    setBusy(true); setErr('');
    try {
      const text = await askClaude(`You are an expert in South African public-sector procurement (PFMA/MFMA, PPPFA 2022 regulations, CSD, B-BBEE) helping an IT company decide whether and how to bid.

TENDER
${tenderBrief(t)}
${docsNote(docText, files) || '\n(No tender documents provided - say where the documents need to be checked.)'}

Write a practical bid analysis with these plain-text sections (no markdown tables):
1. WHAT THEY WANT - scope in plain language
2. GO / NO-GO - fit, risks, red flags (e.g. very short deadline, compulsory briefing, unrealistic specs)
3. MANDATORY REQUIREMENTS - everything that disqualifies if missing, and where to obtain each in South Africa
4. EVALUATION - functionality threshold and price/preference points system if stated
5. WHAT TO SOURCE AND WHERE - products/services/licences needed and suitable South African distributors, OEM partners or service providers to get quotes from
6. ROUGH COST BUILD-UP - main cost lines to price (do not invent the buyer's budget)
7. ACTION PLAN - day-by-day steps until the closing date
Be specific. If something cannot be known without the documents, say so instead of guessing.`, 4000, false, files);
      setOut(text); store.set(key, text);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return <>
    <TenderHeader t={t} />
    <div className="panel">
      <DocInput t={t} docText={docText} setDocText={setDocText} files={files} setFiles={setFiles} />
      <div className="row">
        <button className="btn primary" onClick={run} disabled={busy}>{busy ? 'Analysing…' : out ? 'Re-run analysis' : 'Run AI analysis'}</button>
        {out && <button className="btn" onClick={() => download(`Analysis_${t.reference}.txt`, out)}>Download</button>}
      </div>
      {err && <p className="urgent">{err}</p>}
    </div>
    {out && <div className="panel sec"><div className="ai">{out}</div>
      <p className="note">AI output - verify every requirement against the official tender documents before submitting.</p></div>}
  </>;
}

// ---------- Bid builder ----------
function BidBuilder({ t }) {
  const sKey = 'bid_' + t.id;
  const [state, setState] = useState(store.get(sKey, { done: {}, notes: {}, custom: [] }));
  const [help, setHelp] = useState(null); // {title, text}
  const [busy, setBusy] = useState('');
  const [docText, setDocText] = useState(store.get('doctext_' + t.id, ''));
  const [files, setFiles] = useDocFiles(t.id);
  const [newReq, setNewReq] = useState('');
  useEffect(() => { store.set(sKey, state); }, [state]);
  useEffect(() => { store.set('doctext_' + t.id, docText); }, [docText]);

  const all = [...STANDARD_REQS, ...state.custom];
  const doneCount = all.filter(r => state.done[r.id]).length;
  const pct = all.length ? Math.round(doneCount / all.length * 100) : 0;
  const setDone = (id, v) => setState(s => ({ ...s, done: { ...s.done, [id]: v } }));
  const setNote = (id, v) => setState(s => ({ ...s, notes: { ...s.notes, [id]: v } }));
  const addCustom = (name, where = '') => setState(s => ({ ...s, custom: [...s.custom, { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), name, where, custom: true }] }));
  const removeCustom = (id) => setState(s => ({ ...s, custom: s.custom.filter(r => r.id !== id) }));

  const getHelp = async (r) => {
    setBusy(r.id);
    try {
      const text = await askClaude(`Help a South African IT company meet this requirement for a government tender.
Requirement: "${r.name}"
${r.where ? `Known guidance: ${r.where}` : ''}
Tender: ${t.reference} - ${t.title} (${t.department}), closing ${fmtDate(t.closingDate)}.
Give: exactly what document/evidence to submit, where to get it in South Africa (official sites, accredited bodies, or suitable suppliers), typical turnaround time and cost, and common mistakes that get bids disqualified. Be concise and practical.`, 1500);
      setHelp({ title: r.name, text });
    } catch (e) { setHelp({ title: 'Error', text: e.message }); }
    setBusy('');
  };

  const extract = async () => {
    if (!docText.trim() && !files.length) { setHelp({ title: 'Add the tender documents first', text: 'Upload the tender PDF or Word file, or paste its text, then extract.' }); return; }
    setBusy('extract');
    try {
      const text = await askClaude(`From this South African government tender document, list every requirement the bidder must meet or submit that is specific to this tender (mandatory documents, technical specifications, certifications, experience, briefing sessions, functionality criteria). Skip generic items already covered: CSD, tax compliance, CIPC, B-BBEE, SBD forms.
Return ONLY a JSON array of objects: [{"name": "short requirement", "where": "where/how to obtain or evidence it in South Africa"}]. Max 25 items.

DOCUMENT:${docsNote(docText, files)}`, 3000, false, files);
      const m = text.match(/\[[\s\S]*\]/);
      const items = m ? JSON.parse(m[0]) : [];
      items.forEach(i => i?.name && addCustom(String(i.name), String(i.where || '')));
      setHelp({ title: 'Requirements extracted', text: `Added ${items.length} tender-specific requirement(s) to the checklist below. Check them against the document.` });
    } catch (e) { setHelp({ title: 'Error', text: e.message }); }
    setBusy('');
  };

  const template = async () => {
    setBusy('template');
    try {
      const text = await askClaude(`Draft a bid response pack for this South African government IT tender, written for the bidder to complete.
${tenderBrief(t)}
${docsNote(docText, files)}
Include: cover letter, executive summary, company profile (with placeholders), understanding of requirements, technical solution and methodology, project plan and timeline, team and experience, risk management, pricing schedule structure, compliance checklist, and list of annexures. Use [PLACEHOLDER] for anything the bidder must fill in. Plain text with clear headings.`, 6000, false, files);
      download(`Bid_Response_${t.reference.replace(/[^\w-]+/g, '_')}.txt`, text);
    } catch (e) { setHelp({ title: 'Error', text: e.message }); }
    setBusy('');
  };

  return <>
    <TenderHeader t={t} />
    <div className="panel">
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
        <strong>Bid readiness</strong><span>{doneCount} / {all.length} ({pct}%)</span></div>
      <div className="bar"><div style={{ width: pct + '%' }} /></div>
      <div className="row">
        <button className="btn primary" onClick={template} disabled={!!busy}>{busy === 'template' ? 'Drafting…' : 'Draft bid response (AI)'}</button>
        <button className="btn" onClick={() => download(`Checklist_${t.reference}.txt`, checklistText(t, all, state))}>Download checklist</button>
      </div>
    </div>

    <div className="panel sec">
      <h2>Tender-specific requirements</h2>
      <p className="note">The detailed requirements are inside the tender documents. Upload them (or paste their text) and let AI pull them into your checklist, or add them yourself. Files you upload here are shared with the AI analysis tab.</p>
      <DocInput t={t} docText={docText} setDocText={setDocText} files={files} setFiles={setFiles} />
      <div className="row">
        <button className="btn primary" onClick={extract} disabled={!!busy}>{busy === 'extract' ? 'Extracting…' : 'Extract requirements (AI)'}</button>
      </div>
      <div className="row">
        <input style={{ flex: 1, minWidth: 200 }} value={newReq} onChange={e => setNewReq(e.target.value)} placeholder="Add a requirement manually…"
          onKeyDown={e => { if (e.key === 'Enter' && newReq.trim()) { addCustom(newReq.trim()); setNewReq(''); } }} />
        <button className="btn" onClick={() => { if (newReq.trim()) { addCustom(newReq.trim()); setNewReq(''); } }}>Add</button>
      </div>
    </div>

    <div className="sec">
      {all.map(r => (
        <div key={r.id} className={'req' + (state.done[r.id] ? ' done' : '')}>
          <input type="checkbox" checked={!!state.done[r.id]} onChange={e => setDone(r.id, e.target.checked)} />
          <div style={{ flex: 1 }}>
            <strong>{r.name}</strong>{r.custom && <span className="chip gray" style={{ marginLeft: 8 }}>this tender</span>}
            {r.where && <div className="where">Where to get it: {r.where} {r.link && <a href={r.link} target="_blank" rel="noopener">{r.link.replace('https://', '')} ↗</a>}</div>}
            <input style={{ marginTop: 8, fontSize: 13, padding: '7px 10px' }} placeholder="Notes (e.g. requested on 14 Oct, file name)…"
              value={state.notes[r.id] || ''} onChange={e => setNote(r.id, e.target.value)} />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <button className="btn" onClick={() => getHelp(r)} disabled={!!busy}>{busy === r.id ? '…' : 'Help'}</button>
            {r.custom && <button className="btn" onClick={() => removeCustom(r.id)}>Remove</button>}
          </div>
        </div>
      ))}
    </div>

    {help && <div className="modal" onClick={() => setHelp(null)}>
      <div className="box" onClick={e => e.stopPropagation()}>
        <h2>{help.title}</h2><div className="ai" style={{ marginTop: 10 }}>{help.text}</div>
        <div className="row"><button className="btn primary" onClick={() => setHelp(null)}>Close</button></div>
      </div></div>}
  </>;
}

function checklistText(t, all, state) {
  return `BID CHECKLIST - ${t.reference}\n${t.title}\n${t.department}\nCloses: ${fmtDate(t.closingDate)}\n\n` +
    all.map(r => `[${state.done[r.id] ? 'x' : ' '}] ${r.name}${r.where ? `\n    Where: ${r.where}` : ''}${state.notes[r.id] ? `\n    Notes: ${state.notes[r.id]}` : ''}`).join('\n\n');
}

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
